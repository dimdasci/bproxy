<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>bproxy pairing</title>
		<script type="module" src="./main.ts"></script>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 0;
				padding: 12px 16px;
				min-width: 260px;
			}
			h1 {
				font-size: 14px;
				margin: 0 0 8px;
			}
			form {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			section {
				margin-top: 12px;
				padding-top: 12px;
				border-top: 1px solid #e2e2e2;
			}
			label {
				font-size: 12px;
				color: #555;
			}
			label.inline {
				display: flex;
				align-items: center;
				gap: 8px;
				color: #111;
			}
			input[type="text"] {
				font: inherit;
				padding: 6px 8px;
				border: 1px solid #ccc;
				border-radius: 4px;
			}
			button {
				font: inherit;
				padding: 6px 8px;
				border: 1px solid #888;
				border-radius: 4px;
				background: #f4f4f4;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.6;
				cursor: progress;
			}
			#eval-hint {
				font-size: 12px;
				color: #555;
				margin: 6px 0 0;
			}
			#status {
				font-size: 12px;
				margin-top: 8px;
				min-height: 1.2em;
			}
			#status[data-state="success"] {
				color: #167a30;
			}
			#status[data-state="error"] {
				color: #a4262c;
			}
			#status[data-state="pending"] {
				color: #555;
			}
		</style>
	</head>
	<body>
		<h1>bproxy pairing</h1>
		<form id="pair-form" autocomplete="off">
			<label for="code">Pairing code</label>
			<input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" required />
			<button id="submit" type="submit">Pair</button>
		</form>
		<section aria-labelledby="eval-mode-title">
			<h1 id="eval-mode-title">Eval mode</h1>
			<label class="inline" for="eval-mode">
				<input id="eval-mode" name="eval-mode" type="checkbox" disabled />
				<span>Enable eval mode</span>
			</label>
			<p id="eval-hint">Pair the extension with the daemon before enabling Eval mode.</p>
		</section>
		<div id="status" data-state="idle" role="status" aria-live="polite"></div>
	</body>
</html>

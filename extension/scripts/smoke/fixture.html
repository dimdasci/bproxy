<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>bproxy smoke fixture</title>
		<style>
			:root {
				color-scheme: light;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
					"Segoe UI", sans-serif;
			}

			body {
				margin: 0;
				background: #f8fafc;
				color: #0f172a;
			}

			main {
				max-width: 48rem;
				margin: 0 auto;
				padding: 2rem 1rem 6rem;
			}

			.card {
				background: white;
				border: 1px solid #cbd5e1;
				border-radius: 0.75rem;
				padding: 1rem;
				box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
			}

			form {
				display: grid;
				gap: 0.75rem;
			}

			label {
				font-weight: 600;
			}

			input,
			textarea,
			select,
			button {
				font: inherit;
				padding: 0.65rem 0.75rem;
				border-radius: 0.5rem;
				border: 1px solid #94a3b8;
			}

			button {
				width: fit-content;
				background: #0f172a;
				color: white;
				cursor: pointer;
			}

			#scroll-sentinel {
				margin-top: 1600px;
				padding: 1rem;
				background: #dbeafe;
				border-radius: 0.75rem;
			}
		</style>
	</head>
	<body>
		<main>
			<section class="card">
				<h1 id="smoke-text">bproxy extension smoke fixture</h1>
				<p>
					Local-only page for Phase 3 Task 15. It exercises reads, paste fill,
					scroll, and debug-log correlation without hitting external sites.
				</p>
			</section>

			<section class="card" style="margin-top: 1rem">
				<form>
					<div>
						<label for="smoke-name">Name</label>
						<input id="smoke-name" name="name" placeholder="Paste target" />
					</div>

					<div>
						<label for="smoke-notes">Notes</label>
						<textarea id="smoke-notes" name="notes" rows="4"></textarea>
					</div>

					<div>
						<label for="smoke-role">Role</label>
						<select id="smoke-role" name="role">
							<option>Agent</option>
							<option>Operator</option>
							<option>Reviewer</option>
						</select>
					</div>

					<button id="smoke-button" type="button">Idle button</button>
				</form>
			</section>

			<section class="card" style="margin-top: 1rem">
				<h2>Paste echo</h2>
				<p id="smoke-output">empty</p>
			</section>

			<section id="scroll-sentinel">
				<h2>Scroll sentinel</h2>
				<p>The smoke workflow should scroll this page before finishing.</p>
			</section>
		</main>

		<script>
			const input = document.querySelector("#smoke-name");
			const output = document.querySelector("#smoke-output");
			const render = () => {
				output.textContent = input.value || "empty";
			};
			input.addEventListener("input", render);
			input.addEventListener("change", render);
			render();
		</script>
	</body>
</html>

name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'views/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]

# Only one concurrent docs run per ref. For Pages deploys this is enforced
# again at the deploy job with a Pages-scoped group so we never overlap a
# live deploy, but we keep the per-ref group so PR builds also self-cancel.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter views typecheck

      - name: Build site
        run: pnpm docs:build

      - name: Run unit tests
        run: pnpm -r build && pnpm test

      # Upload the built site only on push to main so PRs don't generate
      # Pages artifacts. The artifact name is fixed by deploy-pages.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: views/dist

  deploy:
    # Only deploy on push to main. PR runs stop after build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish to Pages
      id-token: write    # OIDC for deploy-pages auth
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows only one in-flight deployment per environment; serialise
    # without cancelling so a queued deploy still ships the latest commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.6

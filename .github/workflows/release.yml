name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # ─── Quality gates ──────────────────────────────────────────────
      - name: Check (typecheck + format + lint + arch + deadcode)
        run: pnpm check

      - name: Test
        run: pnpm test

      # ─── Build all workspaces ───────────────────────────────────────
      - name: Build all
        run: pnpm -r build

      # ─── Assemble npm package ───────────────────────────────────────
      - name: Assemble release package
        run: bash scripts/build-release.sh

      # ─── Publish to npm ─────────────────────────────────────────────
      - name: Publish to npm
        run: cd dist && npm publish --access public --provenance

      # ─── Package extension zip ──────────────────────────────────────
      - name: Package extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd extension/.output/chrome-mv3
          zip -r "$GITHUB_WORKSPACE/bproxy-extension-v${VERSION}.zip" .

      # ─── Create GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: bproxy-extension-v*.zip
          body: |
            ## Install

            ```bash
            npm install -g @dimdasci/bproxy
            ```

            **Extension:** Download the attached zip, extract, then load unpacked in `chrome://extensions` (Developer mode).

            **npm:** https://www.npmjs.com/package/@dimdasci/bproxy

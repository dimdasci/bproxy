name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # CI does not need package lifecycle hooks; skipping them prevents unreviewed install scripts from executing.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # ─── Verify tag matches source version ─────────────────────────
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✓ Tag $GITHUB_REF_NAME matches package.json ($PKG_VERSION)"

      # ─── Quality gates ──────────────────────────────────────────────
      - name: Check (typecheck + format + lint + arch + deadcode)
        run: pnpm check

      - name: Test
        run: pnpm test

      # ─── Build all workspaces ───────────────────────────────────────
      - name: Build all
        run: pnpm -r build

      # ─── Assemble npm package ───────────────────────────────────────
      - name: Assemble release package
        run: bash scripts/build-release.sh

      - name: Smoke-test release binaries
        run: bash scripts/smoke-release.sh

      # ─── Publish to npm ─────────────────────────────────────────────
      - name: Publish to npm
        run: cd dist && npm publish --access public --provenance

      # ─── Create GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            npm install -g @dimdasci/bproxy
            ```

            **Extension:** Install [bproxy from the Chrome Web Store](https://chromewebstore.google.com/detail/bproxy/hjedkgneajbgjpgepbffdeanekhfffhc). Chrome manages extension updates automatically.

            **npm:** https://www.npmjs.com/package/@dimdasci/bproxy

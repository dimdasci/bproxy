name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # ─── Quality gates ──────────────────────────────────────────────
      - name: Check (typecheck + format + lint + arch + deadcode)
        run: pnpm check

      - name: Test
        run: pnpm test

      # ─── Build all workspaces ───────────────────────────────────────
      - name: Build all
        run: pnpm -r build

      # ─── Assemble npm package ───────────────────────────────────────
      - name: Assemble release package
        run: bash scripts/build-release.sh

      # ─── Publish to npm ─────────────────────────────────────────────
      - name: Publish to npm
        run: cd dist && npm publish --access public --provenance

      # ─── Package extension zip ──────────────────────────────────────
      - name: Package extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd extension/.output/chrome-mv3
          zip -r "$GITHUB_WORKSPACE/bproxy-extension-v${VERSION}.zip" .

      # ─── Create GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          files: bproxy-extension-v*.zip
          body: |
            ## Install

            ```bash
            npm install -g @dimdasci/bproxy
            ```

            **Extension:** Download the attached zip, extract, then load unpacked in `chrome://extensions` (Developer mode).

            **npm:** https://www.npmjs.com/package/@dimdasci/bproxy

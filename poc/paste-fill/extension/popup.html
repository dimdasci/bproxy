<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px sans-serif; padding: 10px; width: 320px; }
      button, input { width: 100%; margin: 6px 0; padding: 7px; box-sizing: border-box; }
      pre { background: #f5f5f5; padding: 8px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
      .muted { color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <h3>LinkedIn Editor API PoC</h3>
    <input id="value" value="PoC LinkedIn test" />
    <button id="fill">1) Fill composer</button>
    <button id="check">2) Check current composer text</button>
    <button id="snapshot">3) Dump DOM snapshot JSON</button>
    <div class="muted">Shadow-aware + Quill runtime API path.</div>
    <pre id="log"></pre>
    <script src="popup.js"></script>
  </body>
</html>
